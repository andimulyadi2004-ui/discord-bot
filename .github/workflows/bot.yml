name: bot
on:
  workflow_dispatch:
    inputs:
      sisa:
        description: "Sisa sesi"
        default: "12"
permissions:
  actions: write
  contents: read
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Antri sesi berikutnya
        run: |
          S=${{ inputs.sisa }}
          if [ "$S" -gt 1 ]; then gh workflow run bot.yml -f sisa=$((S-1)); fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - run: timeout 350m python bot.py || true
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
